<!DOCTYPE html>
<html>
<head>
    <title>Stock Bot Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 60px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Stock Portfolio Dashboard</h1>
        <p>Welcome to your virtual portfolio tracker!</p>
        <p>Visit <code>/portfolio/YOUR_DISCORD_ID</code> to view your portfolio</p>
    </div>
</body>
</html>
