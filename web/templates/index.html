<!DOCTYPE html>
<html>
<head>
    <title>Stock Bot Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 60px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            font-size: 18px;
            margin-bottom: 30px;
        }
        .login-btn {
            background: #5865F2;
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s;
        }
        .login-btn:hover {
            background: #4752C4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Stock Portfolio Dashboard</h1>
        <p>Track your virtual stock portfolio with real-time data</p>
        <a href="/login" class="login-btn">Login with Discord</a>
    </div>
</body>
</html>
