<!DOCTYPE html>
<html>
<head>
    <title>No Account Found</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 600px;
            margin: 100px auto;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
            font-size: 18px;
        }
        .logout-btn {
            background: #ee0979;
            color: white;
            padding: 10px 30px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚠️ No Portfolio Found</h1>
        <p>Welcome, {{ username }}!</p>
        <p>You don't have a portfolio account yet.</p>
        <p>Please run <code>/portfolio_start</code> in Discord to create your account first!</p>
        <a href="/logout" class="logout-btn">Logout</a>
    </div>
</body>
</html>
